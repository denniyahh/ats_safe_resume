# Pandoc defaults for ATS Safe Resume
# The build script reads YAML frontmatter from resume.md and merges
# theme/page_mode settings into this file before running pandoc.
#
# Users can also provide a pandoc-defaults.user.yaml to override
# settings (fonts, margins, etc.) without modifying repo files.

from: markdown+smart
standalone: true
pdf-engine: lualatex

# Template
template: templates/eisvogel.latex

# Font settings (can be overridden via YAML frontmatter)
variables:
  mainfont: Source Sans 3
  mainfontoptions: Ligatures=NoCommon
  monofont: Source Code Pro
  fontsize: 10pt
  colorlinks: true
  linkcolor: darkgray

# Metadata defaults (overridden by YAML frontmatter)
metadata:
  title: "Your Name — Resume"

# Custom preamble (accent bars, compact spacing)
# The build script prepends the theme file before this one
include-in-header:
  - resume-preamble.tex
