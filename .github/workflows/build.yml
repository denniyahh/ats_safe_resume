name: Build Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/ats_safe_resume

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck build_resume.sh

  build:
    name: Build all formats
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip poppler-utils \
            curl ca-certificates unzip fontconfig
          # Install Source Sans 3 and Source Code Pro fonts
          mkdir -p ~/.fonts
          curl -fsSL "https://github.com/adobe-fonts/source-sans/releases/download/3.052R/TTF-source-sans-3.052R.zip" -o /tmp/sourcesans.zip
          curl -fsSL "https://github.com/adobe-fonts/source-code-pro/releases/download/2.042R-u%2F1.062R-i%2F1.026R-vf/TTF-source-code-pro-2.042R-u_1.062R-i.zip" -o /tmp/sourcecode.zip
          unzip -qo /tmp/sourcesans.zip -d ~/.fonts/
          unzip -qo /tmp/sourcecode.zip -d ~/.fonts/
          fc-cache -f ~/.fonts/

      - name: Install Python deps
        run: pip3 install -e . -q && pip3 install pytest -q

      - name: Build resume
        run: python3 -m ats_safe_resume example/resume.md --out-dir dist

      - name: Validate all outputs
        run: python3 -m pytest tests/test_parser.py tests/test_models.py -v

      - name: Copy demo PDF to tracked location
        run: cp dist/resume.pdf example/resume.pdf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-outputs
          path: dist/
          retention-days: 90

      - name: Commit demo PDF
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/resume.pdf
          git diff --cached --quiet || git commit -m "Update example/resume.pdf [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:main

  docker:
    name: Build and publish Docker image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
